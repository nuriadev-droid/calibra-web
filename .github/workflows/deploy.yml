# Construye la web de producto y lo publica en GitHub Pages en cada push a main.
# Requiere activar una vez: Settings → Pages → Source: GitHub Actions
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Paginas de servicios para el modo puente
        run: |
          git clone --depth 1 https://github.com/innovare-genetics/calibra-studio.git /tmp/studio
          node /tmp/studio/build-static.js --dominio https://studio.calibraautomation.com
      - name: Generar la web de producto
        run: STUDIO_DIST=/tmp/studio/dist node build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
